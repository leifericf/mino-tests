name: ci-nightly

# Heavier work runs once a day. PR-time CI keeps to the smoke set so
# push latency stays low; the nightly job catches:
#   - Adversarial soak (random seed, longer budget)
#   - GC stress under MINO_GC_STRESS=1
#   - Coverage report (clang-only; macos-14 runner has clang+llvm-cov)
#
# A failure here is shown on the actions tab but doesn't block
# anything -- the smoke set is the PR-blocking signal.

on:
  schedule:
    # 05:00 UTC daily, off-peak. 1h after mino's own 04:00 nightly so
    # the submodule pin update flows cleanly if both are scheduled.
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  soak:
    name: soak (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 70

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build mino
        # `make` bootstraps ./mino. `./mino task build-lean` then
        # builds ./mino-lean so probes that compare across the
        # auto/on/off/lean quad have a binary to spawn.
        working-directory: mino
        run: |
          make
          ./mino task build-lean

      - name: Adversarial soak
        env:
          MINO_BIN: ${{ github.workspace }}/mino/mino
          MINO_LEAN_BIN: ${{ github.workspace }}/mino/mino-lean
        run: |
          seed=$(date +%s)
          echo "Soak seed: $seed"
          ./mino/mino tests/adv/runner.clj --seed "$seed" --mode soak

      - name: Differential soak (diff-test-soak)
        env:
          MINO_BIN: ${{ github.workspace }}/mino/mino
          MINO_LEAN_BIN: ${{ github.workspace }}/mino/mino-lean
        timeout-minutes: 60
        run: ./mino/mino task diff-test-soak

      - name: JVM core differential soak (jvm-core, full corpus)
        # Compares the full jvm-core corpus against the committed JVM
        # ground truth (tests/adv/fixtures/jvm-core-jvm.edn, captured
        # by `clojure -M tests/adv/jvm_core_capture.clj` on a dev
        # host; refresh via ./mino task jvm-core-refresh). No JVM runs
        # here -- the fixture is the oracle. Allowlist entries shrink
        # as mino fixes land; a fresh divergence fails this lane.
        env:
          MINO_BIN: ${{ github.workspace }}/mino/mino
          MINO_LEAN_BIN: ${{ github.workspace }}/mino/mino-lean
        timeout-minutes: 10
        run: ./mino/mino tests/adv/runner.clj --mode soak --only jvm_core

      - name: Upload diff regressions on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diff-regressions-soak-${{ matrix.os }}
          path: tests/adv/regressions/diff-*
          if-no-files-found: ignore

  # ---- GC safeguards (added after the v0.255.6/.7/.8 CI hang ----
  # at transient-survives-gc-yield surfaced how easily a GC bug can
  # hide behind full-suite Heisenbug masking. Each safeguard catches
  # a different shape of bug. These live in their own job (not the
  # soak matrix) because the nursery fuzz alone runs the full suite
  # twice at tiny nurseries -- ~40 min on the slowest runner -- which
  # cannot share the soak job's wall-clock budget.
  gc:
    name: gc lanes (macos-14)
    runs-on: macos-14
    defaults:
      run:
        shell: bash
    # Budget: stress 15 + fuzz 65 + subset 10 + verify 60 (the verify
    # walk multiplies suite runtime) + asan-per-file and slack.
    timeout-minutes: 170

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build mino
        working-directory: mino
        run: make

      - name: GC stress (MINO_GC_STRESS=1)
        run: |
          MINO_GC_STRESS=1 ./mino/mino tests/run_gc_stress.clj
        timeout-minutes: 15

      - name: GC nursery-size fuzz (allowed-to-fail)
        # Runs mino tests/run.clj at the 64K extreme nursery. Catches
        # bugs sensitive to major-phase × test-position alignment --
        # the tight nursery shifts where each major falls in the test
        # sequence. As the suite grew a single pass nearly fills the
        # old budget, so the lane runs the extreme size only.
        #
        # Probation: the tight-nursery GC cycle landed the suspected
        # root causes (the IC-slot and vec-spine barrier no-ops, the
        # MTH001 slot-release race; mino ADR 66), the image/tar test
        # exclusions and the thread-limit headroom are lifted, and the
        # task throws on failure so a regression shows visibly red.
        # Drop this continue-on-error (and gc-verify's below) after 7
        # consecutive green nightlies on this configuration.
        continue-on-error: true
        run: ./mino/mino task gc-fuzz
        timeout-minutes: 65

      - name: GC stress on (gc!)-using subset
        # Runs the curated shard with MINO_GC_STRESS=1 (every alloc
        # forces a full major). Sized for stress mode so it finishes
        # in ~50s rather than tens of minutes.
        run: ./mino/mino task gc-stress-subset
        timeout-minutes: 10

      - name: GC verify (allowed-to-fail)
        # MINO_GC_VERIFY=1 aborts on a barrier-or-remset miss; the
        # task now throws on the abort instead of swallowing it, so a
        # miss shows red here. The verify walk multiplies suite
        # runtime (every live OLD is walked before each minor), hence
        # the raised timeout; the perf-shape files are excluded in the
        # task for the same reason. Same probation as gc-fuzz above:
        # drop continue-on-error after 7 consecutive green nightlies.
        continue-on-error: true
        run: ./mino/mino task gc-verify
        timeout-minutes: 60

      - name: ASan per file
        # One ASan subprocess per mino test file. Catches Heisenbugs
        # that hide under full-suite ASan because cumulative heap
        # state masks the dangerous phase window.
        run: ./mino/mino task asan-per-file
        timeout-minutes: 20

  coverage:
    name: coverage (macos-14, clang)
    runs-on: macos-14
    defaults:
      run:
        shell: bash
    timeout-minutes: 45
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build mino
        # `make` bootstraps ./mino. `./mino task build-lean` then
        # builds ./mino-lean so probes that compare across the
        # auto/on/off/lean quad have a binary to spawn.
        working-directory: mino
        run: |
          make
          ./mino task build-lean

      - name: Coverage pass
        env:
          MINO_BIN: ${{ github.workspace }}/mino/mino
        run: ./mino/mino task cov-summary
